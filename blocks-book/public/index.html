<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Poetry Book - A collection of 66 poems"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>BLOCKS Poetry Book</title>
    <style>
      @media screen and (max-width: 480px) {
        .poem-content {
          font-size: 0.75rem !important;
          line-height: 1.5 !important;
          letter-spacing: 0.1px !important;
          word-break: keep-all !important;
          white-space: pre-wrap !important;
        }
        .poem-number {
          font-size: 1.2rem !important;
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      // Force disable any audio elements that might be cached
      window.addEventListener('DOMContentLoaded', function() {
        // Disable any audio elements
        var audioElements = document.getElementsByTagName('audio');
        for (var i = 0; i < audioElements.length; i++) {
          audioElements[i].pause();
          audioElements[i].src = '';
          audioElements[i].remove();
        }
        
        // Disable audio in any video elements
        var videoElements = document.getElementsByTagName('video');
        for (var i = 0; i < videoElements.length; i++) {
          videoElements[i].muted = true;
          videoElements[i].volume = 0;
        }
        
        // Intercept Audio constructor
        var originalAudio = window.Audio;
        window.Audio = function() {
          var audio = new originalAudio();
          audio.muted = true;
          audio.volume = 0;
          audio.pause = function() { return true; };
          audio.play = function() { return new Promise(function(resolve) { resolve(); }); };
          return audio;
        };
      });
    </script>
  </body>
</html>
